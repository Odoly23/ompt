{% extends "panel/base.html" %}
{% block title %}Hamoos{% endblock %}
{% block content %}
<div class="card border-danger" style="max-width:560px">
  <div class="card-body">
    <h1 class="h4 slab">Hamoos "{{ obj }}"?</h1>
    <p>Dadus ne'e sei lakon ba nafatin no la bele restaura.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger">Hamoos</button>
      <a class="btn btn-link" href="{% url 'panel:list' key %}">Kansela</a>
    </form>
  </div>
</div>
{% endblock %}
